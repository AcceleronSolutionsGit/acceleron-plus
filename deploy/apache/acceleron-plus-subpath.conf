# ═══════════════════════════════════════════════════════════════
# Acceleron Plus as a folder of an existing site:
#     https://apps.acceleronsolutions.io/acceleron-plus/
#
# NOT a site of its own. Copy to /etc/apache2/acceleron-plus.inc and add
# ONE line inside the existing <VirtualHost *:443> for
# apps.acceleronsolutions.io (on APPLSRV: /etc/apache2/default-server.conf),
# next to the other ProxyPass lines:
#
#     Include /etc/apache2/acceleron-plus.inc
#
# Uses the site's existing certificate. The app runs on 127.0.0.1:8099
# (ecosystem.config.js) and must be BUILT with
#     NEXT_PUBLIC_BASE_PATH=/acceleron-plus
# in .env.local, because Next.js expects the folder name in every URL —
# which is why the ProxyPass below keeps it (…:8099/acceleron-plus/).
#
# Everything here is scoped to /acceleron-plus, so the other apps on
# this site are not affected.
# ═══════════════════════════════════════════════════════════════

# The bare folder (no trailing slash) goes to the app too. NOT a redirect
# to "/acceleron-plus/": Next.js answers that with a redirect back to
# "/acceleron-plus", and the two loop (ERR_TOO_MANY_REDIRECTS).
ProxyPassMatch   "^/acceleron-plus$" "http://127.0.0.1:8099/acceleron-plus"
ProxyPassReverse "/acceleron-plus"   "http://127.0.0.1:8099/acceleron-plus"

<Location "/acceleron-plus/">
    # timeout: Excel/PDF/PPT exports can take a while to build.
    ProxyPass        "http://127.0.0.1:8099/acceleron-plus/" nocanon timeout=120
    ProxyPassReverse "http://127.0.0.1:8099/acceleron-plus/"

    # The app reads the FIRST X-Forwarded-For entry for its sign-in audit
    # log and rate limit, and mod_proxy only appends to whatever the
    # browser sent — so drop the browser's copy here, before mod_proxy
    # adds the real address.
    RequestHeader unset X-Forwarded-For
    RequestHeader set   X-Real-IP "%{REMOTE_ADDR}s"
    RequestHeader set   X-Forwarded-Proto "https"

    # Project documents may be up to 50 MB; refuse anything over 55 MB
    # before it reaches the app. (LimitRequestBody does nothing for
    # proxied requests in Apache 2.4.)
    <If "%{HTTP:Content-Length} -gt 57671680">
        Require all denied
        ErrorDocument 403 "Upload too large (55 MB maximum)."
    </If>
</Location>

# Hashed build assets never change — let browsers keep them.
<LocationMatch "^/acceleron-plus/_next/static/">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>

# The app's own files live in /srv/www/htdocs/acceleron-plus — inside the
# site's DocumentRoot. Requests for /acceleron-plus/… are proxied above, so
# they never reach the folder; this makes sure nothing else ever serves
# .env.local, the source or the build as plain files. (Proxied requests are
# not affected by <Directory>.)
<Directory "/srv/www/htdocs/acceleron-plus">
    Require all denied
</Directory>
