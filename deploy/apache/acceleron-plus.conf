# Apache site for Acceleron Plus — copy to /etc/apache2/sites-available/
# and replace plus.example.com with your domain. `certbot --apache` copies
# this block into acceleron-plus-le-ssl.conf for :443 and adds the
# certificate lines for you, so everything below applies to HTTPS too.
#
# Needs: sudo a2enmod proxy proxy_http headers rewrite ssl

<VirtualHost *:80>
    ServerName plus.example.com

    # ── Reverse proxy to `next start` on 127.0.0.1:3000 (pm2) ──────────
    ProxyRequests Off
    ProxyPreserveHost On

    # Next.js decides what a URL means; don't let Apache re-encode or
    # reject paths first (encoded slashes in file names, for example).
    AllowEncodedSlashes NoDecode

    # Excel/PDF/PPT exports can take a while to build.
    ProxyTimeout 120

    ProxyPass        / http://127.0.0.1:3000/ nocanon
    ProxyPassReverse / http://127.0.0.1:3000/

    # ── Forwarded headers ──────────────────────────────────────────────
    # mod_proxy APPENDS the client address to any X-Forwarded-For the
    # browser sent. The app reads the FIRST entry for its sign-in audit
    # log and rate limits, so a forged header would win. Drop whatever
    # the client sent before mod_proxy adds the real address.
    RequestHeader unset X-Forwarded-For early
    RequestHeader set   X-Real-IP "%{REMOTE_ADDR}s"
    RequestHeader set   X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    # X-Forwarded-Host is added by mod_proxy itself.

    # ── Uploads ────────────────────────────────────────────────────────
    # Project documents may be up to 50 MB (document-storage.ts); refuse
    # anything over 55 MB before it is streamed to the app.
    # Not LimitRequestBody: Apache 2.4 does not apply it to requests it
    # proxies, so it would silently do nothing here.
    RewriteEngine On
    RewriteCond expr "%{HTTP:Content-Length} -gt 57671680"
    RewriteRule ^ - [R=413,L]

    # ── Caching ────────────────────────────────────────────────────────
    # Hashed build assets never change — let browsers keep them.
    <LocationMatch "^/_next/static/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    ErrorLog  ${APACHE_LOG_DIR}/acceleron-plus.error.log
    CustomLog ${APACHE_LOG_DIR}/acceleron-plus.access.log combined
</VirtualHost>
