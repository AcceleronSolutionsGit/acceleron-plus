# Apache site for Acceleron Plus.
#
#   SUSE:   /etc/apache2/vhosts.d/acceleron-plus.conf
#   Ubuntu: /etc/apache2/sites-available/acceleron-plus.conf + a2ensite
#
# Replace plus.example.com with your domain (3 places) and point the two
# SSLCertificate lines at your certificate. With Let's Encrypt the paths
# below are what certbot creates; for a company certificate, use its
# .crt/.key files instead.
#
# The app itself listens on 127.0.0.1:8099 (pm2, ecosystem.config.js) and
# is never opened to the network — people only ever reach Apache.
#
# Needs: a2enmod proxy proxy_http headers rewrite ssl   (SUSE also: a2enflag SSL)

# ── http:// → https:// ─────────────────────────────────────────────
<VirtualHost *:80>
    ServerName plus.example.com

    # Let's Encrypt renewals answer over plain http; everything else moves.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName plus.example.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/plus.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/plus.example.com/privkey.pem

    # ── Reverse proxy to `next start` on 127.0.0.1:8099 (pm2) ──────────
    ProxyRequests Off
    ProxyPreserveHost On

    # Next.js decides what a URL means; don't let Apache re-encode or
    # reject paths first (encoded slashes in file names, for example).
    AllowEncodedSlashes NoDecode

    # Excel/PDF/PPT exports can take a while to build.
    ProxyTimeout 120

    ProxyPass        / http://127.0.0.1:8099/ nocanon
    ProxyPassReverse / http://127.0.0.1:8099/

    # ── Forwarded headers ──────────────────────────────────────────────
    # mod_proxy APPENDS the client address to any X-Forwarded-For the
    # browser sent. The app reads the FIRST entry for its sign-in audit
    # log and rate limits, so a forged header would win. Drop whatever
    # the client sent before mod_proxy adds the real address.
    RequestHeader unset X-Forwarded-For early
    RequestHeader set   X-Real-IP "%{REMOTE_ADDR}s"
    RequestHeader set   X-Forwarded-Proto "https"
    # X-Forwarded-Host is added by mod_proxy itself.

    # ── Uploads ────────────────────────────────────────────────────────
    # Project documents may be up to 50 MB (document-storage.ts); refuse
    # anything over 55 MB before it is streamed to the app.
    # Not LimitRequestBody: Apache 2.4 does not apply it to requests it
    # proxies, so it would silently do nothing here.
    RewriteEngine On
    RewriteCond expr "%{HTTP:Content-Length} -gt 57671680"
    RewriteRule ^ - [R=413,L]

    # ── Caching ────────────────────────────────────────────────────────
    # Hashed build assets never change — let browsers keep them.
    <LocationMatch "^/_next/static/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # /var/log/apache2 exists on both SUSE and Ubuntu.
    ErrorLog  /var/log/apache2/acceleron-plus.error.log
    CustomLog /var/log/apache2/acceleron-plus.access.log combined
</VirtualHost>
</IfModule>
