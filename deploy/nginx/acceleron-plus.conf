# nginx site for Acceleron Plus — copy to /etc/nginx/sites-available/
# and replace plus.example.com with your domain. certbot --nginx adds the
# HTTPS server block and certificate lines to this file for you.

upstream acceleron_plus {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name plus.example.com;

    # Project documents may be up to 50 MB (document-storage.ts).
    client_max_body_size 55m;

    # Excel/PDF/PPT exports can take a while to build.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Hashed build assets never change — let browsers keep them.
    location /_next/static/ {
        proxy_pass http://acceleron_plus;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://acceleron_plus;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # nginx is the only proxy, so overwrite (not append) — the app reads
        # the first entry for its audit log and a client could forge it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
